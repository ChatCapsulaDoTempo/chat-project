<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Chat da Sala</title>
    <style>
        :root {
            --bg-main: #000000;          
            --bg-container: #0b141a;     
            --blue-dark: #075e54;        
            --blue-light: #86c5da;       
            --text-msg: #e9edef;         
            --text-sub: #667781;         
            --border: #222e35;           
            --msg-in: #1f2c34;           
            --msg-out: #0a4d68;          
            --recording: #ea4335;        
        }

        * { 
            box-sizing: border-box; 
            margin: 0; 
            padding: 0; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
        }
        
        body, html { 
            background: var(--bg-main); 
            height: 100%; 
            width: 100%; 
            overflow: hidden; 
            display: flex; 
            justify-content: center; 
            align-items: center;
        }
        
        .container { 
            background: var(--bg-container); 
            width: 100%; 
            height: 100%; 
            max-width: 500px; 
            display: flex; 
            flex-direction: column; 
            overflow: hidden; 
            position: relative;
        }

        @media (min-width: 501px) {
            .container {
                height: 92vh;
                border-radius: 12px;
                box-shadow: 0 4px 20px rgba(0,0,0,0.5);
            }
        }
        
        .hidden { display: none !important; }
        
        /* --- TELA DE LOGIN --- */
        #auth-container { 
            padding: 30px; 
            justify-content: center; 
            align-items: center; 
            display: flex; 
            flex-direction: column; 
            height: 100%;
            background: var(--bg-container);
        }
        #auth-container h2 { 
            margin-bottom: 25px; 
            font-weight: 600; 
            font-size: 24px; 
            color: var(--blue-light); 
        }
        
        /* --- TELA DO CHAT --- */
        #chat-container { 
            display: flex; 
            flex-direction: column; 
            height: 100%; 
        }
        
        .chat-header { 
            background: #111b21; 
            padding: 12px 16px; 
            border-bottom: 1px solid var(--border); 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            height: 60px;
        }
        .chat-header h3 { 
            font-size: 16px; 
            font-weight: 600; 
            color: var(--blue-light);
            max-width: 70%; 
            overflow: hidden; 
            text-overflow: ellipsis; 
            white-space: nowrap; 
        }
        
        #messages { 
            flex: 1; 
            padding: 16px; 
            overflow-y: auto; 
            background-color: var(--bg-main); 
            background-image: radial-gradient(var(--border) 1px, transparent 0); 
            background-size: 20px 20px; 
            display: flex; 
            flex-direction: column; 
            gap: 8px; 
        }
        
        /* Estrutura externa para acomodar o balão + botão de lixeira */
        .msg-row {
            display: flex;
            width: 100%;
            align-items: center;
            gap: 8px;
        }
        .msg-row.out { justify-content: flex-end; }
        .msg-row.in { justify-content: flex-start; }

        .msg-wrapper { 
            display: flex; 
            flex-direction: column; 
            max-width: 80%; 
            width: fit-content; 
            animation: fadeIn 0.15s ease-out; 
            position: relative;
        }
        
        .msg-author { 
            font-size: 12px; 
            color: var(--blue-light); 
            font-weight: 600;
            margin-left: 4px; 
            margin-bottom: 2px; 
        }
        .msg-row.out .msg-author { display: none; } 

        .msg-box { 
            padding: 8px 12px 22px 12px; 
            border-radius: 12px; 
            font-size: 15px; 
            line-height: 1.4; 
            word-break: break-word; 
            box-shadow: 0 1px 1px rgba(0,0,0,0.2); 
            position: relative;
            color: var(--text-msg);
        }
        .msg-row.in .msg-box { 
            background: var(--msg-in); 
            border-top-left-radius: 0; 
        }
        .msg-row.out .msg-box { 
            background: var(--msg-out); 
            border-top-right-radius: 0; 
        }

        audio {
            max-width: 220px;
            height: 40px;
            margin-top: 4px;
            outline: none;
        }

        .msg-time {
            position: absolute;
            bottom: 3px;
            right: 8px;
            font-size: 10px;
            color: var(--blue-light);
            opacity: 0.8;
        }

        /* Botão da Lixeira (Oculto por padrão, aparece ao passar o mouse ou focar) */
        .btn-delete {
            background: transparent;
            color: #ef5350;
            border: none;
            cursor: pointer;
            font-size: 14px;
            padding: 5px;
            width: auto;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s;
            opacity: 0.6;
        }
        .btn-delete:hover {
            background: rgba(239, 83, 80, 0.1);
            opacity: 1;
        }
        
        input { 
            width: 100%; 
            padding: 14px; 
            margin: 8px 0; 
            border: 1px solid var(--border); 
            border-radius: 8px; 
            background: #202c33; 
            color: var(--text-msg); 
            font-size: 16px; 
            outline: none; 
        }
        input:focus { border-color: var(--blue-light); }
        
        button { 
            width: 100%; 
            padding: 14px; 
            background: var(--msg-out); 
            color: var(--blue-light); 
            border: none; 
            border-radius: 8px; 
            cursor: pointer; 
            font-size: 16px; 
            font-weight: 600; 
            transition: opacity 0.2s; 
        }
        button:hover { opacity: 0.9; }
        
        .chat-input-area { 
            padding: 10px; 
            background: #111b21; 
            border-top: 1px solid var(--border); 
            display: flex; 
            gap: 8px; 
            align-items: center; 
            height: 60px;
        }
        .chat-input-area input { 
            margin: 0; 
            flex: 1; 
            border-radius: 24px; 
            padding: 10px 16px;
            border: none;
        }
        .chat-input-area button { 
            width: auto; 
            padding: 10px 18px; 
            border-radius: 24px; 
            background: var(--blue-dark);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #btn-audio {
            background: #202c33;
            color: #aebac1;
        }
        #btn-audio.recording {
            background: var(--recording);
            color: white;
            animation: pulse 1.2s infinite;
        }
        
        .btn-logout { 
            background: transparent; 
            color: #ef5350; 
            padding: 6px 12px; 
            font-size: 13px; 
            font-weight: normal; 
            width: auto; 
            border: 1px solid #ef5350; 
            border-radius: 20px; 
        }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.6; } 100% { opacity: 1; } }
    </style>
</head>
<body>

    <div class="container">
        <div id="auth-container">
            <h2>Entrar no Chat</h2>
            <input type="text" id="student-name" placeholder="Digite seu nome...">
            <button id="btn-entrar" onclick="login()">Entrar no Chat</button>
        </div>

        <div id="chat-container" class="hidden">
            <div class="chat-header">
                <h3>Olá, <span id="user-display"></span>!</h3>
                <button class="btn-logout" onclick="logout()">Sair</button>
            </div>
            
            <div id="messages">Carregando mensagens...</div>
            
            <div class="chat-input-area">
                <input type="text" id="msg-input" placeholder="Digite sua mensagem aqui..." onkeydown="if(event.key === 'Enter') sendMessage()">
                <button id="btn-audio" onclick="toggleAudioRecord()">🎤</button>
                <button onclick="sendMessage()">Enviar</button>
            </div>
        </div>
    </div>

    <script>
        const URL_DO_SCRIPT = "https://script.google.com/macros/s/AKfycbxcB6DJdBFsfKhLTadjzynv2flHjComA0Yp5GwuFmW2UgcyItSIcMGlmSIC00A3cCiLTA/exec";
        
        let usuarioLogado = "";
        let temporizadorChat = null;
        let listaMensagensLocais = []; // Guarda o histórico para renderização incremental inteligente
        
        let mediaRecorder = null;
        let pedacosAudio = [];
        let gravando = false;

        document.addEventListener("DOMContentLoaded", () => {
            const inputNome = document.getElementById('student-name');
            if(inputNome) {
                inputNome.addEventListener('keydown', function(e) {
                    if (e.key === 'Enter') {
                        e.preventDefault();
                        login();
                    }
                });
            }
        });

        function login() {
            const nomeInput = document.getElementById('student-name').value.trim();
            if(nomeInput) {
                usuarioLogado = nomeInput;
                
                document.getElementById('auth-container').classList.add('hidden');
                document.getElementById('chat-container').classList.remove('hidden');
                document.getElementById('user-display').innerText = nomeInput;
                
                setTimeout(() => {
                    const msgInput = document.getElementById('msg-input');
                    if(msgInput) msgInput.focus();
                }, 100);
                
                // Reseta a lista ao entrar para garantir sincronia limpa
                listaMensagensLocais = [];
                const msgArea = document.getElementById('messages');
                if(msgArea) msgArea.innerHTML = '';

                atualizarChat();
                temporizadorChat = setInterval(atualizarChat, 3000);
            } else {
                alert("Por favor, digite o seu nome para entrar.");
            }
        }

        function formatarHora(stringData) {
            try {
                const data = new Date(stringData);
                if (isNaN(data.getTime())) {
                    const agora = new Date();
                    return agora.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
                }
                return data.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
            } catch (e) {
                return "";
            }
        }

        // Nova engenharia de sincronização: Não limpa a tela se não houver mudanças reais estruturais
        async function atualizarChat() {
            const msgArea = document.getElementById('messages');
            if (!msgArea) return;

            try {
                const response = await fetch(URL_DO_SCRIPT);
                const dadosServidor = await response.json();
                
                if(!dadosServidor || dadosServidor.length === 0) {
                    if(msgArea.children.length === 0) {
                        msgArea.innerHTML = '<p id="no-msg" style="color:var(--text-sub); text-align:center; font-size:14px; margin-top:20px;">Nenhuma mensagem por enquanto...</p>';
                    }
                    return;
                }

                const noMsgTxt = document.getElementById('no-msg');
                if(noMsgTxt) noMsgTxt.remove();

                // Filtra e pega apenas itens novos comparando o tamanho ou o índice cronológico
                let indexInicial = listaMensagensLocais.length;
                
                if (dadosServidor.length < listaMensagensLocais.length) {
                    // Se o banco reduziu drasticamente por intervenção externa, reconstrói de forma segura
                    msgArea.innerHTML = '';
                    listaMensagensLocais = [];
                    indexInicial = 0;
                }

                for (let i = indexInicial; i < dadosServidor.length; i++) {
                    const item = dadosServidor[i];
                    listaMensagensLocais.push(item);
                    
                    const eMinha = item.nome === usuarioLogado;
                    
                    // Container da linha estrutural
                    const row = document.createElement('div');
                    row.className = `msg-row ${eMinha ? 'out' : 'in'}`;
                    row.setAttribute('data-index', i);
                    
                    const wrapper = document.createElement('div');
                    wrapper.className = 'msg-wrapper';
                    
                    const author = document.createElement('div');
                    author.className = 'msg-author';
                    author.innerText = item.nome;
                    
                    const box = document.createElement('div');
                    box.className = 'msg-box';

                    if (item.mensagem && item.mensagem.startsWith("data:audio/")) {
                        const audioPlayer = document.createElement('audio');
                        audioPlayer.src = item.mensagem;
                        audioPlayer.controls = true;
                        audioPlayer.preload = "metadata";
                        box.appendChild(audioPlayer);
                    } else {
                        box.innerText = item.mensagem || "";
                    }
                    
                    const timeSpan = document.createElement('span');
                    timeSpan.className = 'msg-time';
                    timeSpan.innerText = formatarHora(item.data);
                    
                    box.appendChild(timeSpan);
                    wrapper.appendChild(author);
                    wrapper.appendChild(box);
                    
                    // Adiciona o botão da lixeira individual
                    const btnDelete = document.createElement('button');
                    btnDelete.className = 'btn-delete';
                    btnDelete.innerHTML = '🗑️';
                    btnDelete.title = 'Apagar mensagem';
                    btnDelete.onclick = function() {
                        if(confirm("Deseja apagar esta mensagem da sua visualização?")) {
                            row.remove();
                        }
                    };

                    // Ordem visual correta dos elementos dependendo de quem enviou
                    if(eMinha) {
                        row.appendChild(btnDelete); // Lixeira vem antes do balão na direita
                        row.appendChild(wrapper);
                    } else {
                        row.appendChild(wrapper);
                        row.appendChild(btnDelete); // Lixeira vem depois do balão na esquerda
                    }
                    
                    msgArea.appendChild(row);
                    msgArea.scrollTop = msgArea.scrollHeight; 
                }
            } catch (erro) {
                console.error("Erro ao sincronizar dados:", erro);
            }
        }

        async function sendMessage() {
            const input = document.getElementById('msg-input');
            if(!input) return;
            
            const texto = input.value.trim();
            if(!texto) return;
            input.value = '';

            await enviarDadoBruto(texto);
        }

        async function enviarDadoBruto(conteudoMensagem) {
            const dadosEnvio = {
                nome: usuarioLogado,
                mensagem: conteudoMensagem,
                data: new Date().toISOString()
            };

            try {
                await fetch(URL_DO_SCRIPT, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(dadosEnvio)
                });
                atualizarChat();
            } catch (erro) {
                console.error("Erro ao enviar:", erro);
            }
        }

        async function toggleAudioRecord() {
            const btnAudio = document.getElementById('btn-audio');
            if(!btnAudio) return;
            
            if (!gravando) {
                pedacosAudio = [];
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    mediaRecorder = new MediaRecorder(stream);
                    
                    mediaRecorder.ondataavailable = event => {
                        if (event.data && event.data.size > 0) pedacosAudio.push(event.data);
                    };

                    mediaRecorder.onstop = async () => {
                        if (pedacosAudio.length === 0) return;
                        
                        const audioBlob = new Blob(pedacosAudio, { type: 'audio/webm' });
                        const reader = new FileReader();
                        reader.readAsDataURL(audioBlob);
                        reader.onloadend = async () => {
                            const base64Audio = reader.result;
                            await enviarDadoBruto(base64Audio);
                        };

                        stream.getTracks().forEach(track => track.stop());
                    };

                    mediaRecorder.start();
                    gravando = true;
                    btnAudio.innerText = "🛑";
                    btnAudio.classList.add('recording');
                } catch (err) {
                    alert("Acesse as configurações do seu navegador e permita o uso do microfone.");
                    console.error(err);
                }
            } else {
                if(mediaRecorder && mediaRecorder.state !== "inactive") {
                    mediaRecorder.stop();
                }
                gravando = false;
                btnAudio.innerText = "🎤";
                btnAudio.classList.remove('recording');
            }
        }

        function logout() {
            if(temporizadorChat) clearInterval(temporizadorChat);
            location.reload();
        }
    </script>
</body>
</html>
